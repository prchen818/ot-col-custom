receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  jaeger:
    protocols:
      thrift_compact:
        endpoint: 0.0.0.0:6831
      thrift_binary:
        endpoint: 0.0.0.0:6832
      thrift_http:
        endpoint: 0.0.0.0:14268
      grpc:
        endpoint: 0.0.0.0:14250


# 在这里分别定义两个处理器的配置
processors:
  tail_sampling:
    sample_rate: 0.1
    update_interval: 3
    kafka:
      brokers:
        - kafka:9092
      topic: "otlp_spans"
      group: "my-group"
    dynamic: true
    controller:
      kp: 0.5
      ki: 0
      kd: 0.01
      alpha: 0.2
      lag_threshold: 20
      lag_base: 200

  batch:
  groupbytrace:
    wait_duration: 1s

exporters:
  debug:
    verbosity: basic

  otlp:
    endpoint: jaeger:4317
    tls:
      insecure: true

  file:
    format: json
    path: ./traces
  kafka:
    brokers:
      - kafka:9092


service:
  pipelines:
    traces:
      receivers: [otlp, jaeger]
      processors: [tail_sampling]
      exporters: [kafka]